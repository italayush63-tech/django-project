{% extends 'myapp/base.html' %}

{% block content %}
   <h1>Contact page</h1>
   
   {% if success %}
       <p style="color: green;">Thanks! Your message was sent.</p>
   {% endif %}
   
   <form method="post">
       {% csrf_token %}
       {{ form.as_p }}
       <button type="submit">Send</button>
   </form>    
   {% endblock %}
